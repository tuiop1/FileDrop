spring:
  application:
    name: FileDrop

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: true

application:
  rate-limit:
    request:
      limit: ${FILEDROP_REQUEST_RATE_LIMIT:100}
      window: ${FILEDROP_REQUEST_RATE_WINDOW:1m}

    upload:
      limit: ${FILEDROP_UPLOAD_RATE_LIMIT:5}
      window: ${FILEDROP_UPLOAD_RATE_WINDOW:1m}

  temporary-storage:
    directory: ${java.io.tmpdir}/filedrop
    cleanup:
      max-age: 4h

  encryption:
    key-version: ${FILEDROP_MASTER_KEY_VERSION:1}

  cleanup:
    batch-size: 50
    interval: 60s
    pending-timeout: 1h

  file:
    max-size: 100MB
    expiration:
      min: 1m
      max: 7d

clamav:
  connect-timeout: 2s
  read-timeout: 30s

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
