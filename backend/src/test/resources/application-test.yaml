spring:
  datasource:
    url: jdbc:h2:mem:filedrop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  docker:
    compose:
      enabled: false

application:
  base-url: http://localhost:8080

  encryption:
    master-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  storage:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: filedrop-test
      access-key: test
      secret-key: test-secret
      path-style: true

clamav:
  host: localhost
  port: 3310
