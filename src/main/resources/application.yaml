spring:
  application:
    name: FileDrop

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  modulith:
    events:
      republish-outstanding-events-on-restart:  true
      jdbc:
        schema-initialization:
          enabled: true



application:

  filedrop:
    temporary-storage:
      directory: ${FILEDROP_TEMP_DIR:${java.io.tmpdir}/filedrop}

    encryption:
      master-key: ${FILEDROP_MASTER_KEY:}
      key-version: ${FILEDROP_MASTER_KEY_VERSION:1}

    storage:
      s3:
        endpoint: http://localhost:9000
        region: us-east-1
        bucket: filedrop
        access-key: filedrop
        secret-key: filedrop
        path-style: true



  file:
    max-size: 100MB
    expiration:
      min: 1m
      max: 7d



clamav:
  host: localhost
  port: 3310
  connect-timeout: 2s
  read-timeout: 30s
