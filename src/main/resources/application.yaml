spring:
  application:
    name: FileDrop

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ${FILEDROP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:

    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  modulith:
    events:
      republish-outstanding-events-on-restart:  true
      jdbc:
        schema-initialization:
          enabled: true



application:
  base-url: http://localhost:8080

  temporary-storage:
    directory: ${java.io.tmpdir}/filedrop

  encryption:
    master-key: ${FILEDROP_MASTER_KEY:}
    key-version: 1

  storage:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: filedrop
      access-key: filedrop
      secret-key: ${FILEDROP_S3_SECRET_KEY:filedrop-local-secret}
      path-style: true

  cleanup:
    batch-size: 50
    interval: 60s
    pending-timeout: 1h

  file:
    max-size: 100MB
    expiration:
      min: 1m
      max: 7d



clamav:
  host: localhost
  port: 3310
  connect-timeout: 2s
  read-timeout: 30s
server:
  port: 8080
