apiVersion: batch/v1
kind: Job

metadata:
  name: minio-init
  namespace: filedrop

spec:
  backoffLimit: 10

  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: minio-init
          image: quay.io/minio/mc:latest

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: filedrop-secrets
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filedrop-secrets
                  key: MINIO_ROOT_PASSWORD

            - name: FILEDROP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: filedrop-secrets
                  key: FILEDROP_S3_ACCESS_KEY

            - name: FILEDROP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: filedrop-secrets
                  key: FILEDROP_S3_SECRET_KEY

          command:
            - /bin/sh
            - -c
            - |
              set -e

              until mc alias set local \
                http://minio:9000 \
                "$MINIO_ROOT_USER" \
                "$MINIO_ROOT_PASSWORD"
              do
                echo "Waiting for MinIO..."
                sleep 2
              done

              mc mb --ignore-existing local/filedrop

              mc admin user info local "$FILEDROP_S3_ACCESS_KEY" >/dev/null 2>&1 || \
                mc admin user add \
                  local \
                  "$FILEDROP_S3_ACCESS_KEY" \
                  "$FILEDROP_S3_SECRET_KEY"

              mc admin policy attach \
                local \
                readwrite \
                --user "$FILEDROP_S3_ACCESS_KEY"

              echo "MinIO initialized."