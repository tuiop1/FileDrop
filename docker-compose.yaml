name: filedrop-dev

services:
  postgres:
    image: 'postgres:18.4'
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: 'redis:8-alpine'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  clamav:
    image: clamav/clamav:latest
    ports:
      - '3310:3310'

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FILEDROP_S3_ACCESS_KEY: ${FILEDROP_S3_ACCESS_KEY:-filedrop}
      FILEDROP_S3_SECRET_KEY: ${FILEDROP_S3_SECRET_KEY:-filedrop-local-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        until /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo 'Waiting for MinIO...'
          sleep 2
        done

        /usr/bin/mc mb --ignore-existing local/filedrop

        /usr/bin/mc admin user info local "$${FILEDROP_S3_ACCESS_KEY}" >/dev/null 2>&1 || \
          /usr/bin/mc admin user add local "$${FILEDROP_S3_ACCESS_KEY}" "$${FILEDROP_S3_SECRET_KEY}"

        /usr/bin/mc admin policy attach local readwrite --user "$${FILEDROP_S3_ACCESS_KEY}"
        echo 'MinIO bucket and FileDrop application user are ready.'

  backend:
    profiles: ['backend']
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: filedrop-backend:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_URL: redis://redis:6379
      FILEDROP_BASE_URL: http://localhost:8080
      FILEDROP_S3_ENDPOINT: http://minio:9000
      FILEDROP_S3_ACCESS_KEY: ${FILEDROP_S3_ACCESS_KEY:-filedrop}
      FILEDROP_S3_SECRET_KEY: ${FILEDROP_S3_SECRET_KEY:-filedrop-local-secret}
      FILEDROP_CLAMAV_HOST: clamav
      FILEDROP_LOG_LEVEL: ${FILEDROP_LOG_LEVEL:-DEBUG}
    ports:
      - '8080:8080'

  frontend:
    profiles: ['frontend']
    build:
      context: ./frontend
      dockerfile: Dockerfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      FILEDROP_BACKEND_URL: ${FILEDROP_BACKEND_URL:-http://host.docker.internal:8080}
      FILEDROP_PROXY_TIMEOUT: ${FILEDROP_PROXY_TIMEOUT:-15m}
    ports:
      - '4200:80'

volumes:
  postgres_data:
  minio_data:
