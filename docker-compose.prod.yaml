name: filedrop-prod

services:
  postgres:
    image: 'postgres:18.4'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filedrop}
      POSTGRES_USER: ${POSTGRES_USER:-filedrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: 'redis:8-alpine'
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${FILEDROP_REDIS_PASSWORD:?FILEDROP_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - exec redis-server --save '' --appendonly no --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  clamav:
    image: 'clamav/clamav:latest'
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  minio:
    image: 'quay.io/minio/minio:latest'
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: 'quay.io/minio/mc:latest'
    restart: 'no'
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      FILEDROP_S3_BUCKET: ${FILEDROP_S3_BUCKET:-filedrop}
      FILEDROP_S3_ACCESS_KEY: ${FILEDROP_S3_ACCESS_KEY:?FILEDROP_S3_ACCESS_KEY is required}
      FILEDROP_S3_SECRET_KEY: ${FILEDROP_S3_SECRET_KEY:?FILEDROP_S3_SECRET_KEY is required}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e

        until /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo 'Waiting for MinIO...'
          sleep 2
        done

        /usr/bin/mc mb --ignore-existing "local/$${FILEDROP_S3_BUCKET}"

        /usr/bin/mc admin user info local "$${FILEDROP_S3_ACCESS_KEY}" >/dev/null 2>&1 || \
          /usr/bin/mc admin user add local "$${FILEDROP_S3_ACCESS_KEY}" "$${FILEDROP_S3_SECRET_KEY}"

        /usr/bin/mc admin policy attach local readwrite --user "$${FILEDROP_S3_ACCESS_KEY}"
        echo 'MinIO bucket and FileDrop application user are ready.'
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${FILEDROP_BACKEND_IMAGE:-filedrop-backend:prod}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-filedrop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-filedrop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: default
      SPRING_DATA_REDIS_PASSWORD: ${FILEDROP_REDIS_PASSWORD:?FILEDROP_REDIS_PASSWORD is required}
      SPRING_DATA_REDIS_DATABASE: ${FILEDROP_REDIS_DATABASE:-0}
      FILEDROP_BASE_URL: ${FILEDROP_BASE_URL:?FILEDROP_BASE_URL is required}
      FILEDROP_MASTER_KEY: ${FILEDROP_MASTER_KEY:?FILEDROP_MASTER_KEY is required}
      FILEDROP_MASTER_KEY_VERSION: ${FILEDROP_MASTER_KEY_VERSION:-1}
      FILEDROP_S3_ENDPOINT: http://minio:9000
      FILEDROP_S3_REGION: ${FILEDROP_S3_REGION:-us-east-1}
      FILEDROP_S3_BUCKET: ${FILEDROP_S3_BUCKET:-filedrop}
      FILEDROP_S3_ACCESS_KEY: ${FILEDROP_S3_ACCESS_KEY:?FILEDROP_S3_ACCESS_KEY is required}
      FILEDROP_S3_SECRET_KEY: ${FILEDROP_S3_SECRET_KEY:?FILEDROP_S3_SECRET_KEY is required}
      FILEDROP_S3_PATH_STYLE: 'true'
      FILEDROP_CLAMAV_HOST: clamav
      FILEDROP_CLAMAV_PORT: 3310
      FILEDROP_REQUEST_RATE_LIMIT: ${FILEDROP_REQUEST_RATE_LIMIT:-100}
      FILEDROP_REQUEST_RATE_WINDOW: ${FILEDROP_REQUEST_RATE_WINDOW:-1m}
      FILEDROP_UPLOAD_RATE_LIMIT: ${FILEDROP_UPLOAD_RATE_LIMIT:-5}
      FILEDROP_UPLOAD_RATE_WINDOW: ${FILEDROP_UPLOAD_RATE_WINDOW:-1m}
      FILEDROP_LOG_LEVEL: ${FILEDROP_LOG_LEVEL:-INFO}
    expose:
      - '8080'
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FILEDROP_FRONTEND_IMAGE:-filedrop-frontend:prod}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      FILEDROP_BACKEND_URL: http://backend:8080
    ports:
      - '${FILEDROP_HTTP_PORT:-80}:80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  clamav_data:
  minio_data:

networks:
  edge:
  internal:
    internal: true
