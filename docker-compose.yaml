services:
  postgres:
    image: 'postgres:18.4'
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clamav:
    image: clamav/clamav:latest
    ports:
      - '3310:3310'

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FILEDROP_S3_ACCESS_KEY: ${FILEDROP_S3_ACCESS_KEY:-filedrop}
      FILEDROP_S3_SECRET_KEY: ${FILEDROP_S3_SECRET_KEY:-filedrop-local-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        until /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo 'Waiting for MinIO...'
          sleep 2
        done

        /usr/bin/mc mb --ignore-existing local/filedrop

        /usr/bin/mc admin user info local "$${FILEDROP_S3_ACCESS_KEY}" >/dev/null 2>&1 || \
          /usr/bin/mc admin user add local "$${FILEDROP_S3_ACCESS_KEY}" "$${FILEDROP_S3_SECRET_KEY}"

        /usr/bin/mc admin policy attach local readwrite --user "$${FILEDROP_S3_ACCESS_KEY}"
        echo 'MinIO bucket and FileDrop application user are ready.'

  frontend:
    profiles: ['frontend']
    build:
      context: ./frontend
      dockerfile: Dockerfile
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4200:80'

volumes:
  postgres_data:
  minio_data:
