spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

  docker:
    compose:
      enabled: false

application:
  base-url: ${FILEDROP_BASE_URL}

  encryption:
    master-key: ${FILEDROP_MASTER_KEY}

  storage:
    s3:
      endpoint: ${FILEDROP_S3_ENDPOINT}
      region: ${FILEDROP_S3_REGION}
      bucket: ${FILEDROP_S3_BUCKET}
      access-key: ${FILEDROP_S3_ACCESS_KEY}
      secret-key: ${FILEDROP_S3_SECRET_KEY}
      path-style: ${FILEDROP_S3_PATH_STYLE:false}

clamav:
  host: ${FILEDROP_CLAMAV_HOST}
  port: ${FILEDROP_CLAMAV_PORT:3310}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    dev.tuiop.filedrop: ${FILEDROP_LOG_LEVEL:INFO}
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: production
    json:
      context:
        include: true
