name: Test and build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  build-images:
    name: Validate Compose and build backend image
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Compose resolves required production variables before validation or build.
    # These placeholders are never used to start services in CI.
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      FILEDROP_REDIS_PASSWORD: ci-only-redis-password
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-only-minio-password
      FILEDROP_S3_ACCESS_KEY: ci-filedrop
      FILEDROP_S3_SECRET_KEY: ci-only-s3-secret
      FILEDROP_BASE_URL: https://filedrop.example.invalid
      FILEDROP_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yaml config --quiet

      - name: Build production backend image
        run: docker compose -f docker-compose.prod.yaml build backend
