spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}

application:
  base-url: ${FILEDROP_BASE_URL:http://localhost:8080}

  encryption:
    # Development-only key. Production requires FILEDROP_MASTER_KEY.
    master-key: ${FILEDROP_MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

  storage:
    s3:
      endpoint: ${FILEDROP_S3_ENDPOINT:http://localhost:9000}
      region: ${FILEDROP_S3_REGION:us-east-1}
      bucket: ${FILEDROP_S3_BUCKET:filedrop}
      access-key: ${FILEDROP_S3_ACCESS_KEY:filedrop}
      secret-key: ${FILEDROP_S3_SECRET_KEY:filedrop-local-secret}
      path-style: ${FILEDROP_S3_PATH_STYLE:true}

clamav:
  host: ${FILEDROP_CLAMAV_HOST:localhost}
  port: ${FILEDROP_CLAMAV_PORT:3310}

logging:
  level:
    dev.tuiop.filedrop: ${FILEDROP_LOG_LEVEL:DEBUG}
  pattern:
    correlation: '[%X{requestId:-}] '
