name: filedrop-prod

services:
  postgres:
    image: 'postgres:18.4'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filedrop}
      POSTGRES_USER: ${POSTGRES_USER:-filedrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: 'redis:8-alpine'
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${FILEDROP_REDIS_PASSWORD:?FILEDROP_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - exec redis-server --save '' --appendonly no --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  clamav:
    image: 'clamav/clamav:latest'
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - internal
      - clamav-egress
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${FILEDROP_BACKEND_IMAGE:-filedrop-backend:prod}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-filedrop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-filedrop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_USERNAME: default
      SPRING_DATA_REDIS_PASSWORD: ${FILEDROP_REDIS_PASSWORD:?FILEDROP_REDIS_PASSWORD is required}
      SPRING_DATA_REDIS_DATABASE: ${FILEDROP_REDIS_DATABASE:-0}
      FILEDROP_BASE_URL: ${FILEDROP_BASE_URL:?FILEDROP_BASE_URL is required}
      FILEDROP_MASTER_KEY: ${FILEDROP_MASTER_KEY:?FILEDROP_MASTER_KEY is required}
      FILEDROP_MASTER_KEY_VERSION: ${FILEDROP_MASTER_KEY_VERSION:-1}
      FILEDROP_S3_REGION: ${FILEDROP_S3_REGION:?FILEDROP_S3_REGION is required}
      FILEDROP_S3_BUCKET: ${FILEDROP_S3_BUCKET:?FILEDROP_S3_BUCKET is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      FILEDROP_CLAMAV_HOST: clamav
      FILEDROP_CLAMAV_PORT: 3310
      FILEDROP_CLAMAV_READ_TIMEOUT: ${FILEDROP_CLAMAV_READ_TIMEOUT:-150s}
      FILEDROP_REQUEST_RATE_LIMIT: ${FILEDROP_REQUEST_RATE_LIMIT:-100}
      FILEDROP_REQUEST_RATE_WINDOW: ${FILEDROP_REQUEST_RATE_WINDOW:-1m}
      FILEDROP_UPLOAD_RATE_LIMIT: ${FILEDROP_UPLOAD_RATE_LIMIT:-5}
      FILEDROP_UPLOAD_RATE_WINDOW: ${FILEDROP_UPLOAD_RATE_WINDOW:-1m}
      FILEDROP_LOG_LEVEL: ${FILEDROP_LOG_LEVEL:-INFO}
    expose:
      - '8080'
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FILEDROP_FRONTEND_IMAGE:-filedrop-frontend:prod}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      FILEDROP_BACKEND_URL: http://backend:8080
      FILEDROP_PROXY_TIMEOUT: ${FILEDROP_PROXY_TIMEOUT:-15m}
    ports:
      - '${FILEDROP_HTTP_PORT:-80}:80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  clamav_data:

networks:
  edge:
  clamav-egress:
  internal:
    internal: true
